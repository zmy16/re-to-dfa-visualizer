# Konfigurasi Netlify untuk RE to DFA Visualizer.
#
# Aplikasi ini statis tanpa dependensi, jadi tidak ada langkah build. Yang
# dilakukan perintah build hanya menyalin berkas aplikasi ke public/, supaya
# Design/, tests/, dan dokumen .md tidak ikut terbit.
#
# Untuk deploy manual tanpa Git: `npx netlify deploy --prod` dari folder ini.

[build]
  publish = "public"
  command = "node scripts/prepare-public.mjs"

# Pratinjau deploy dan deploy produksi memakai aturan yang sama.
[context.deploy-preview]
  command = "node scripts/prepare-public.mjs"

[context.branch-deploy]
  command = "node scripts/prepare-public.mjs"

# Berkas statis boleh di-cache lama karena setiap deploy menghasilkan URL baru.
#
# Tidak ada aturan redirect ke index.html di sini. Aplikasi ini hanya satu
# halaman tanpa rute, jadi fallback itu tidak diperlukan. Menambahkannya justru
# berbahaya: URL berkas yang tidak ada akan dibalas HTML dengan status 200,
# sehingga scraper pratinjau tautan seperti WhatsApp menerima HTML sebagai
# gambar dan menampilkan pratinjau yang rusak, bukan gagal dengan jelas.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html selalu diambil ulang agar perubahan langsung terlihat.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Gambar pratinjau tidak boleh di-cache lama oleh scraper tautan, supaya
# perubahan gambar langsung terpakai saat tautan dibagikan ulang.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Tidak ada aturan fallback ke index.html. Halaman ini tidak punya rute, dan
# URL yang tidak ada dibiarkan gagal dengan 404 agar kesalahan seperti gambar
# pratinjau yang hilang langsung terlihat, bukan tersamar sebagai HTML.
